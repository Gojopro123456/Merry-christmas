
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 días contigo 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #fff0f6;
  font-family: Georgia, serif;
  color: #a94e78;
  text-align: center;
  padding: 22px 12px;
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  margin: 12px 0 5px;
  color: #d66d9e;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 22px;
}

.castle {
  position: relative;
  width: min(100%, 650px);
  margin: auto;
}

.castle img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
}

.doors {
  position: absolute;
  inset: 0;
}

.door {
  position: absolute;
  transform: translate(-50%, -50%);
  border: none;
  background: transparent;
  color: transparent;
  cursor: pointer;
  padding: 0;
  border-radius: 35%;
}

.door:disabled {
  cursor: not-allowed;
}

.door:focus-visible {
  outline: 3px dashed #d66d9e;
  background: #ffffff35;
}

.door.opened {
  background: #ffffff25;
}

.bonus {
  margin: 18px auto;
  padding: 14px 30px;
  border: 2px solid white;
  border-radius: 25px;
  background: #e88bb5;
  color: white;
  font-size: 18px;
  font-family: Georgia, serif;
  box-shadow: 0 4px 10px #a94e7840;
}

.bonus:disabled {
  opacity: .5;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #7b345a99;
  z-index: 5;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.letter {
  background: #fff8fc;
  border: 3px solid #f3b5d1;
  border-radius: 22px;
  padding: 28px 20px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 8px 30px #54213c55;
}

.letter h2 {
  color: #d66d9e;
}

.letter p {
  line-height: 1.7;
}

.gift-image {
  display: none;
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  border-radius: 14px;
  margin: 15px auto;
}

.close {
  background: #e88bb5;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 11px 25px;
  font-size: 15px;
}

footer {
  margin: 25px 0;
  color: #c47b9e;
}
</style>
</head>

<body>

<h1>25 días contigo 💗</h1>

<p class="subtitle">
Un pequeño regalo para alguien muy especial 🎀
</p>

<div class="castle">
  <img
    src="11EB7685-B96D-40C5-8B85-B14A298376EC.png"
    alt="Castillo rosa de Navidad"
  >
  <div class="doors" id="doors"></div>
</div>

<button class="bonus" id="bonus">
  Puerta 25 🎁💗
</button>

<footer>Hecho con muchísimo cariño 💗</footer>

<div class="modal" id="modal">
  <div class="letter">
    <h2 id="letterTitle"></h2>

    <img
      id="giftImage"
      class="gift-image"
      alt="Mi regalito para ti"
    >

    <p id="letterText"></p>

    <button class="close" onclick="closeLetter()">
      Cerrar 💗
    </button>
  </div>
</div>

<script>
const surprises = Array.from({length: 25}, (_, i) =>
  `Aquí colocaremos nuestra sorpresa número ${i + 1}. 💗`
);

// Imágenes de los regalos
const giftImages = {
  1: "regalos/117%20sin%20ti%CC%81tulo_20261124032155.jpeg"
};

// Posiciones de las 24 puertas del castillo.
// Formato: [número, centro X, centro Y, ancho, alto]

const positions = [
  [1, 50, 19, 10, 11],
  [2, 39, 24, 10, 11],
  [3, 61, 24, 10, 11],

  [4, 30.5, 35, 10, 11],
  [5, 42.5, 35, 10, 11],
  [6, 57.5, 35, 10, 11],
  [7, 69.5, 35, 10, 11],

  [8, 22, 50, 10, 12],
  [9, 35, 50, 10, 12],
  [10, 50, 50, 12, 12],
  [11, 65, 50, 10, 12],
  [12, 79, 50, 10, 12],

  [13, 22, 66, 10, 12],
  [14, 35, 66, 10, 12],
  [15, 50, 66, 12, 13],
  [16, 65, 66, 10, 12],
  [17, 79, 66, 10, 12],

  [18, 22, 78, 10, 11],
  [19, 35, 78, 10, 11],
  [20, 50, 87, 14, 16],
  [21, 65, 78, 10, 11],
  [22, 79, 78, 10, 11],

  [23, 28, 88, 11, 12],
  [24, 72, 88, 11, 12]
];

const doors = document.getElementById("doors");

function isUnlocked(day) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const unlockDate = new Date(2026, 11, day);
  return today >= unlockDate;
}

function openLetter(day) {
  document.getElementById("letterTitle").textContent =
    "Día " + day + " 💗";

  document.getElementById("letterText").textContent =
    surprises[day - 1];

  const image = document.getElementById("giftImage");

  if (giftImages[day]) {
    image.src = giftImages[day];
    image.style.display = "block";
  } else {
    image.style.display = "none";
    image.src = "";
  }

  document.getElementById("modal").style.display = "flex";
}

positions.forEach(([day, x, y, width, height]) => {
  const button = document.createElement("button");

  button.className = "door";
  button.style.left = x + "%";
  button.style.top = y + "%";
  button.style.width = width + "%";
  button.style.height = height + "%";
  button.setAttribute("aria-label", "Puerta " + day);

  const key = "puerta-" + day;
  const alreadyOpened = localStorage.getItem(key) === "yes";

  button.disabled = !isUnlocked(day) && !alreadyOpened;

  if (alreadyOpened) {
    button.classList.add("opened");
  }

  button.addEventListener("click", () => {
    if (!isUnlocked(day)) return;

    localStorage.setItem(key, "yes");
    button.classList.add("opened");
    openLetter(day);
  });

  doors.appendChild(button);
});

const bonus = document.getElementById("bonus");
const bonusOpened = localStorage.getItem("puerta-25") === "yes";

bonus.disabled = !isUnlocked(25) && !bonusOpened;

if (bonusOpened) {
  bonus.textContent = "Puerta 25 abierta 💗";
}

bonus.addEventListener("click", () => {
  if (!isUnlocked(25)) return;

  localStorage.setItem("puerta-25", "yes");
  bonus.textContent = "Puerta 25 abierta 💗";
  openLetter(25);
});

function closeLetter() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
