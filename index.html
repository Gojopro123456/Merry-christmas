
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días contigo ♡</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  font-family: Georgia, serif;
  text-align: center;
  color: #8b4b5e;
  background: #fff0f5;
}

h1 {
  color: #c65f8c;
  font-size: 32px;
  margin-bottom: 5px;
}

.subtitle { color: #a76c7d; }

.house {
  max-width: 650px;
  margin: 35px auto;
  padding: 20px 14px;
  background: #f5d6bd;
  border: 5px solid white;
  border-radius: 25px;
  box-shadow: 0 8px 25px #d99bb655;
  position: relative;
}

.roof {
  background: #e99cbe;
  padding: 25px 10px;
  margin: -20px -14px 20px;
  border-radius: 20px 20px 35px 35px;
  border-bottom: 12px dotted white;
}

.roof h2 {
  color: white;
  margin: 0;
  font-size: 25px;
}

.decor { font-size: 25px; margin: 12px; }

.doors {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 8px;
}

.door {
  min-height: 70px;
  border: 3px solid white;
  border-radius: 12px;
  background: #edb2ca;
  color: #914b6b;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 5px #b8798c55;
}

.door:disabled {
  background: #dfc9c5;
  color: #a58d8d;
  cursor: not-allowed;
  opacity: .75;
}

.door.opened { background: #fff8ed; }

.note {
  background: #fff9f4;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}

footer { margin: 25px; color: #b66c89; }

@media (min-width: 500px) {
  .doors { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>

<body>

<h1>♡ 24 días contigo ♡</h1>
<p class="subtitle">Un pequeño regalo para alguien muy especial</p>

<div class="house">
  <div class="roof">
    <h2>🍓 Nuestra casita dulce 🍓</h2>
    <div>🤍 🍬 💗 🍬 🤍</div>
  </div>

  <div class="decor">🍭 💕 🍓 💕 🍭</div>

  <h3>Elige tu sorpresa del día</h3>

  <div class="doors" id="doors"></div>

  <div class="decor">🍬 🤍 🍓 🤍 🍬</div>
</div>

<div class="note">
  <p>✨ Cada día esconde un pedacito de cariño. ✨</p>
  <p id="message">¡Vuelve cada día para descubrir una sorpresa!</p>
</div>

<footer>Hecho con muchísimo amor ♡</footer>

<script>
const surprises = Array.from({length: 24}, (_, i) =>
  `Aquí irá tu sorpresa del día ${i + 1} 💗`
);

const doors = document.getElementById("doors");
const message = document.getElementById("message");

const opened = JSON.parse(
  localStorage.getItem("puertasAbiertas") || "[]"
);

const today = new Date();
today.setHours(0, 0, 0, 0);

for (let day = 1; day <= 24; day++) {
  const unlockDate = new Date(2026, 11, day);
  const button = document.createElement("button");

  button.className = "door";
  button.textContent = opened.includes(day) ? "♥" : day;

  const unlocked = today >= unlockDate;

  button.disabled = !unlocked;

  if (!unlocked) {
    button.textContent = day + " 🔒";
  }

  if (opened.includes(day)) {
    button.classList.add("opened");
  }

  button.addEventListener("click", () => {
    if (!opened.includes(day)) {
      opened.push(day);
      localStorage.setItem(
        "puertasAbiertas",
        JSON.stringify(opened)
      );
      button.classList.add("opened");
      button.textContent = "♥";
    }

    message.textContent = surprises[day - 1];
  });

  doors.appendChild(button);
}
</script>

</body>
</html>
