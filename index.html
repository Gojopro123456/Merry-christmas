<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 días contigo 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #fff0f6;
  font-family: Georgia, serif;
  color: #a94e78;
  text-align: center;
  padding: 22px 12px;
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  margin: 12px 0 5px;
  color: #d66d9e;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 22px;
}

.castle {
  position: relative;
  width: min(100%, 650px);
  margin: auto;
}

.castle img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
}

.doors {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(4, 1fr);
  padding: 24% 13% 12%;
  gap: 5px;
}

.door {
  border: 2px solid #fff;
  border-radius: 12px 12px 5px 5px;
  background: rgba(255, 190, 218, .94);
  color: #a74375;
  font-size: clamp(12px, 3vw, 19px);
  font-weight: bold;
  box-shadow: 0 3px 6px #a94e7840;
  cursor: pointer;
}

.door:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.door.opened {
  background: #fff;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #7b345a99;
  z-index: 5;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.letter {
  background: #fff8fc;
  border: 3px solid #f3b5d1;
  border-radius: 22px;
  padding: 28px 20px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 8px 30px #54213c55;
}

.letter h2 {
  color: #d66d9e;
}

.letter p {
  line-height: 1.7;
}

.close {
  background: #e88bb5;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 11px 25px;
  font-size: 15px;
}

footer {
  margin: 25px 0;
  color: #c47b9e;
}
</style>
</head>

<body>

<h1>24 días contigo 💗</h1>
<p class="subtitle">Un pequeño regalo para alguien muy especial 🎀</p>

<div class="castle">
  <img
    src="11EB7685-B96D-40C5-8B85-B14A298376EC.png"
    alt="Nuestro castillo de jengibre rosa y blanco"
  >
  <div class="doors" id="doors"></div>
</div>

<footer>Hecho con mucho cariño 💗</footer>

<div class="modal" id="modal">
  <div class="letter">
    <h2 id="letterTitle"></h2>
    <p id="letterText"></p>
    <button class="close" onclick="closeLetter()">Cerrar 💗</button>
  </div>
</div>

<script>
const surprises = Array.from({length: 24}, (_, i) =>
  `Aquí colocaremos nuestra sorpresa número ${i + 1}. 💗`
);

const doors = document.getElementById("doors");

for (let i = 1; i <= 24; i++) {
  const button = document.createElement("button");
  button.className = "door";
  button.textContent = i;

  const today = new Date();
  const unlockDate = new Date(2026, 11, i);
  today.setHours(0, 0, 0, 0);

  const key = "puerta-" + i;
  const alreadyOpened = localStorage.getItem(key) === "yes";

  button.disabled = today < unlockDate && !alreadyOpened;

  if (alreadyOpened) button.classList.add("opened");

  button.addEventListener("click", () => {
    if (today < unlockDate) return;

    localStorage.setItem(key, "yes");
    button.classList.add("opened");

    document.getElementById("letterTitle").textContent =
      "Día " + i + " 💗";

    document.getElementById("letterText").textContent =
      surprises[i - 1];

    document.getElementById("modal").style.display = "flex";
  });

  doors.appendChild(button);
}

function closeLetter() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
