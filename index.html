<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 días contigo 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #fff0f6;
  font-family: Georgia, serif;
  color: #a94e78;
  text-align: center;
  padding: 22px 12px;
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  margin: 12px 0 5px;
  color: #d66d9e;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 22px;
}

.castle {
  position: relative;
  width: min(100%, 650px);
  margin: auto;
}

.castle img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
}

.doors {
  position: absolute;
  inset: 0;
}

.door {
  position: absolute;
  transform: translate(-50%, -50%);
  border: none;
  background: transparent;
  color: transparent;
  cursor: pointer;
  padding: 0;
  border-radius: 35%;
}

.door:disabled {
  cursor: not-allowed;
}

.door:focus-visible {
  outline: 3px dashed #d66d9e;
  background: #ffffff35;
}

.door.opened {
  background: #ffffff25;
}

.bonus {
  margin: 18px auto;
  padding: 14px 30px;
  border: 2px solid white;
  border-radius: 25px;
  background: #e88bb5;
  color: white;
  font-size: 18px;
  font-family: Georgia, serif;
  box-shadow: 0 4px 10px #a94e7840;
  cursor: pointer;
}

.bonus:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #7b345a99;
  z-index: 5;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-y: auto;
}

.letter {
  background: #fff8fc;
  border: 3px solid #f3b5d1;
  border-radius: 22px;
  padding: 28px 20px;
  max-width: 380px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 30px #54213c55;
}

.letter h2 {
  color: #d66d9e;
}

.letter p {
  line-height: 1.7;
}

.gift-image {
  display: none;
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  border-radius: 14px;
  margin: 15px auto;
}

.close {
  background: #e88bb5;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 11px 25px;
  font-size: 15px;
  cursor: pointer;
}

footer {
  margin: 25px 0;
  color: #c47b9e;
}

.final-chest-area {
  display: none;
  margin: 20px auto;
}

.chest-button {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 12px;
  color: #a94e78;
  font-family: Georgia, serif;
  font-size: 16px;
}

.minecraft-chest {
  position: relative;
  width: 150px;
  height: 105px;
  margin: 15px auto;
}

.chest-body {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 70px;
  background: linear-gradient(90deg, #75401f, #a96632, #75401f);
  border: 5px solid #4b2b19;
  border-radius: 5px;
}

.chest-lid {
  position: absolute;
  top: 5px;
  left: -3px;
  width: 156px;
  height: 38px;
  background: linear-gradient(#bd8145, #895126);
  border: 5px solid #4b2b19;
  border-radius: 7px;
  z-index: 2;
  transition: transform .5s;
}

.chest-lock {
  position: absolute;
  z-index: 3;
  left: 63px;
  top: 35px;
  width: 25px;
  height: 35px;
  background: #e9bd43;
  border: 4px solid #79521b;
  border-radius: 4px;
}

.minecraft-chest.open .chest-lid {
  transform: translateY(-27px) rotate(-8deg);
}

.minecraft-chest.open .chest-lock {
  display: none;
}

.totem-reward {
  display: none;
  margin: 20px auto;
  font-size: 65px;
  animation: aparecer .7s ease;
}

.totem-reward p {
  font-size: 17px;
  color: #a94e78;
}

@keyframes aparecer {
  from { transform: scale(.2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<h1>25 días contigo 💗</h1>

<p class="subtitle">
Un pequeño regalo para alguien muy especial 🎀
</p>

<div class="castle">
  <img
    src="11EB7685-B96D-40C5-8B85-B14A298376EC.png"
    alt="Castillo rosa de Navidad"
  >
  <div class="doors" id="doors"></div>
</div>

<button class="bonus" id="bonus" type="button">
  Puerta 25 🎁💗
</button>

<footer>Hecho con muchísimo cariño 💗</footer>

<div class="modal" id="modal">
  <div class="letter">
    <h2 id="letterTitle"></h2>

    <img
      id="giftImage"
      class="gift-image"
      alt="Mi regalito para ti"
    >

    <p id="letterText"></p>

    <div class="final-chest-area" id="finalChestArea">
      <p>¡Usa la llave para abrir tu último regalo! 🗝️</p>

      <button class="chest-button" id="chestButton" type="button"
              onclick="openChest()">
        <div class="minecraft-chest" id="minecraftChest">
          <div class="chest-lid"></div>
          <div class="chest-body"></div>
          <div class="chest-lock"></div>
        </div>
        <span id="chestInstruction">Abrir cofre 🎁</span>
      </button>

      <div class="totem-reward" id="totemReward">
        🗿
        <p>¡El Tótem de la Inmortalidad! ✨</p>
        <p>Un último regalo para ti 💗</p>
      </div>
    </div>

    <button class="close" type="button" onclick="closeLetter()">
      Cerrar 💗
    </button>
  </div>
</div>

<script>
const surprises = Array.from({length: 25}, () => "");

// Los 24 regalos del calendario
const ruta = nombre =>
  ("regalos/" + nombre).normalize("NFD");

const giftImages = {
  1: ruta("118 sin título_20261124040105.jpeg"),
  2: ruta("122 sin título_20261124051417.jpeg"),
  3: ruta("122 sin título_20261124051803.jpeg"),
  4: ruta("122 sin título_20261124052107.jpeg"),
  5: ruta("122 sin título_20261125014844.jpeg"),
  6: ruta("122 sin título_20261124055013.jpeg"),
  7: ruta("122 sin título_20261124052358.jpeg"),
  8: ruta("122 sin título_20261124060556.jpeg"),
  9: ruta("122 sin título_20261124061523.jpeg"),
  10: ruta("116 sin título_20261124002108.jpeg"),
  11: ruta("126 sin título_20261125060001.jpeg"),
  12: ruta("126 sin título_20261125055112.jpeg"),
  13: ruta("126 sin título_20261125055350.jpeg"),
  14: ruta("126 sin título_20261125060608.jpeg"),
  15: ruta("124 sin título_20261124224749.jpeg"),
  16: ruta("126 sin título_20261125055727.jpeg"),
  17: ruta("126 sin título_20261125060319.jpeg"),
  18: ruta("126 sin título_20261125080623.jpeg"),
  19: ruta("121 sin título_20261124045659.jpeg"),
  20: ruta("121 sin título_20261124045150.jpeg"),
  21: ruta("IMG_4979.jpeg"),
  22: ruta("IMG_4980.jpeg"),
  23: ruta("119 sin título_20261124043323.jpeg"),
  24: ruta("117 sin título_20261124032155.jpeg")
};

// Posiciones originales de las 24 puertas del castillo.
const positions = [
  [1, 50, 19, 10, 11],
  [2, 39, 24, 10, 11],
  [3, 61, 24, 10, 11],
  [4, 30.5, 35, 10, 11],
  [5, 42.5, 35, 10, 11],
  [6, 57.5, 35, 10, 11],
  [7, 69.5, 35, 10, 11],
  [8, 22, 50, 10, 12],
  [9, 35, 50, 10, 12],
  [10, 50, 50, 12, 12],
  [11, 65, 50, 10, 12],
  [12, 79, 50, 10, 12],
  [13, 22, 66, 10, 12],
  [14, 35, 66, 10, 12],
  [15, 50, 66, 12, 13],
  [16, 65, 66, 10, 12],
  [17, 79, 66, 10, 12],
  [18, 22, 78, 10, 11],
  [19, 35, 78, 10, 11],
  [20, 50, 87, 14, 16],
  [21, 65, 78, 10, 11],
  [22, 79, 78, 10, 11],
  [23, 28, 88, 11, 12],
  [24, 72, 88, 11, 12]
];

const doors = document.getElementById("doors");
const bonus = document.getElementById("bonus");

// Compatibilidad: si ya se había abierto el regalo 10,
// se considera que la llave ya fue conseguida.
if (localStorage.getItem("puerta-10") === "yes") {
  localStorage.setItem("llave-regalo10", "yes");
}

function hasKey() {
  return localStorage.getItem("llave-regalo10") === "yes";
}

function isUnlocked(day) {
  if (day === 25) return hasKey();
  return true;
}

function updateBonusButton() {
  const opened = localStorage.getItem("puerta-25") === "yes";
  bonus.disabled = !hasKey() && !opened;
  bonus.textContent = opened
    ? "Puerta 25 abierta 💗"
    : "Puerta 25 🎁💗";
}

function openLetter(day) {
  document.getElementById("letterTitle").textContent =
    day === 25 ? "¡Tu último regalo! 💗" : "Día " + day + " 💗";

  const image = document.getElementById("giftImage");
  const chestArea = document.getElementById("finalChestArea");
  const letterText = document.getElementById("letterText");

  chestArea.style.display = day === 25 ? "block" : "none";

  if (day === 25) {
    image.style.display = "none";
    image.removeAttribute("src");
    letterText.textContent =
      "Llegaste hasta el último regalo. ¡Usa tu llave para descubrirlo!";
    renderChest();
  } else {
    letterText.textContent = surprises[day - 1] || "";

    if (giftImages[day]) {
      image.src = giftImages[day];
      image.style.display = "block";
    } else {
      image.style.display = "none";
      image.removeAttribute("src");
    }
  }

  document.getElementById("modal").style.display = "flex";
}

function renderChest() {
  const opened = localStorage.getItem("cofre-25") === "yes";

  document.getElementById("minecraftChest")
    .classList.toggle("open", opened);

  document.getElementById("totemReward").style.display =
    opened ? "block" : "none";

  document.getElementById("chestInstruction").textContent =
    opened ? "¡Cofre abierto! 💗" : "Abrir cofre 🎁";
}

function openChest() {
  if (!hasKey()) return;

  localStorage.setItem("cofre-25", "yes");
  renderChest();
}

// Crear las 24 puertas del castillo.
positions.forEach(([day, x, y, width, height]) => {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "door";
  button.style.left = x + "%";
  button.style.top = y + "%";
  button.style.width = width + "%";
  button.style.height = height + "%";
  button.setAttribute("aria-label", "Puerta " + day);

  const key = "puerta-" + day;
  const alreadyOpened = localStorage.getItem(key) === "yes";

  if (alreadyOpened) {
    button.classList.add("opened");
  }

  button.addEventListener("click", () => {
    if (!isUnlocked(day)) return;

    localStorage.setItem(key, "yes");

    // El regalo 10 entrega la llave para abrir la puerta 25.
    if (day === 10) {
      localStorage.setItem("llave-regalo10", "yes");
      updateBonusButton();
    }

    button.classList.add("opened");
    openLetter(day);
  });

  doors.appendChild(button);
});

// La puerta 25 se desbloquea únicamente al conseguir la llave del regalo 10.
updateBonusButton();

bonus.addEventListener("click", () => {
  if (!isUnlocked(25) &&
      localStorage.getItem("puerta-25") !== "yes") {
    return;
  }

  localStorage.setItem("puerta-25", "yes");
  updateBonusButton();
  openLetter(25);
});

function closeLetter() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
