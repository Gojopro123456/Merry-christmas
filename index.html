<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 días contigo ♡</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 12px;
  text-align: center;
  font-family: Georgia, serif;
  color: #89516a;
  background: linear-gradient(#fff0f6, #ffe4ed);
}

h1 {
  color: #c15e8c;
  font-size: 34px;
  margin-bottom: 5px;
}

.subtitle { color: #a56b81; }

.scene {
  max-width: 580px;
  margin: 25px auto;
  padding: 10px;
  position: relative;
}

.tower {
  position: absolute;
  top: 35px;
  width: 19%;
  height: 180px;
  background: #e9b995;
  border: 4px solid white;
  border-radius: 50px 50px 12px 12px;
  z-index: 0;
}

.tower.left { left: 2%; }
.tower.right { right: 2%; }

.tower:before {
  content: " ";
  position: absolute;
  top: -38px;
  left: -8px;
  width: calc(100% + 8px);
  height: 65px;
  background: #e994b9;
  border: 4px solid white;
  border-radius: 50% 50% 8px 8px;
}

.tower:after {
  content: "♡";
  position: absolute;
  top: 58px;
  left: 0;
  right: 0;
  font-size: 27px;
  color: white;
}

.house {
  position: relative;
  z-index: 1;
  margin: 75px auto 0;
  max-width: 430px;
  background: #eac19f;
  border: 5px solid white;
  border-radius: 20px;
  padding: 15px 12px 20px;
  box-shadow: 0 9px 20px #bd789b44;
}

.roof {
  margin: -15px -12px 16px;
  padding: 27px 8px 20px;
  background: #e995ba;
  border-bottom: 12px solid white;
  border-radius: 18px 18px 30px 30px;
  position: relative;
}

.roof:after {
  content: "♥  ♥  ♥  ♥  ♥";
  display: block;
  color: white;
  letter-spacing: 8px;
  font-size: 15px;
  margin-top: 12px;
}

.roof h2 {
  margin: 0;
  color: white;
  font-size: 25px;
  text-shadow: 1px 2px #c66b94;
}

.candy {
  font-size: 23px;
  margin: 12px 0;
}

h3 { color: #a45b75; }

.doors {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.door {
  height: 65px;
  border: 3px solid white;
  border-radius: 12px;
  background: #edb3cc;
  color: #994e72;
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: bold;
  box-shadow: 0 3px 5px #a65e7844;
  cursor: pointer;
}

.door:disabled {
  background: #d9c5bd;
  color: #a58e88;
  cursor: not-allowed;
}

.door.opened { background: #fff7e9; }

.note {
  max-width: 430px;
  margin: 20px auto;
  padding: 17px;
  background: #fff9f5;
  border: 2px solid white;
  border-radius: 18px;
}

footer { color: #bd7291; margin: 25px; }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #633d5277;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show { display: flex; }

.letter {
  background: #fff8f3;
  border: 4px solid white;
  border-radius: 22px;
  padding: 28px 20px;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 8px 30px #59344a55;
}

.letter h2 { color: #c15e8c; }

.close {
  background: #e995ba;
  border: none;
  border-radius: 20px;
  padding: 12px 25px;
  color: white;
  font-size: 16px;
}

@media (min-width: 500px) {
  .doors { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>

<body>

<h1>♡ 24 días contigo ♡</h1>
<p class="subtitle">Un pequeño mundo hecho para ti</p>

<div class="scene">

  <div class="tower left"></div>
  <div class="tower right"></div>

  <div class="house">

    <div class="roof">
      <h2>🍓 Nuestra casita dulce 🍓</h2>
      <div>🍬 🤍 🍭 🤍 🍬</div>
    </div>

    <div class="candy">🍓 💗 🍡 💗 🍓</div>

    <h3>Elige una puertecita ♡</h3>

    <div class="doors" id="doors"></div>

    <div class="candy">🍭 🤍 🍓 🤍 🍭</div>

  </div>
</div>

<div class="note">
  ✨ Cada puerta guarda una sorpresa especial. ✨
  <p id="status">Vuelve cada día para descubrir una nueva.</p>
</div>

<div class="modal" id="modal">
  <div class="letter">
    <div style="font-size:35px">💗</div>
    <h2 id="letterTitle">Una sorpresa para ti</h2>
    <p id="letterText"></p>
    <button class="close" onclick="closeLetter()">Cerrar ♡</button>
  </div>
</div>

<footer>Hecho con muchísimo amor ♡</footer>

<script>
const surprises = Array.from(
  {length: 24},
  (_, i) => `Aquí colocaremos nuestra sorpresa número ${i + 1}. ♡`
);

const doors = document.getElementById("doors");
const modal = document.getElementById("modal");
const opened = JSON.parse(
  localStorage.getItem("puertasAbiertas") || "[]"
);

const today = new Date();
today.setHours(0, 0, 0, 0);

for (let day = 1; day <= 24; day++) {
  const unlockDate = new Date(2026, 11, day);
  const button = document.createElement("button");

  button.className = "door";
  button.textContent = day;

  if (opened.includes(day)) {
    button.classList.add("opened");
    button.textContent = "♥";
  }

  button.disabled = today < unlockDate;

  button.addEventListener("click", () => {
    if (today < unlockDate) return;

    if (!opened.includes(day)) {
      opened.push(day);
      localStorage.setItem(
        "puertasAbiertas",
        JSON.stringify(opened)
      );
    }

    button.classList.add("opened");
    button.textContent = "♥";

    document.getElementById("letterTitle").textContent =
      `Día ${day} ♡`;

    document.getElementById("letterText").textContent =
      surprises[day - 1];

    modal.classList.add("show");
  });

  doors.appendChild(button);
}

function closeLetter() {
  modal.classList.remove("show");
}
</script>

</body>
</html>
